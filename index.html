<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitTrack — Workout Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #EEF3EC;
    --bg-elevated: #FFFFFF;
    --text: #16211C;
    --text-muted: #55655A;
    --border: #D8E2D9;
    --primary: #1F6F54;
    --primary-dark: #17543F;
    --accent: #FF7A45;
    --accent-soft: #FFE7DA;
    --danger: #D14D4D;
    --shadow: 0 1px 2px rgba(22,33,28,0.06), 0 4px 16px rgba(22,33,28,0.06);
    --radius: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151C;
      --bg-elevated: #1A2129;
      --text: #EAF1EC;
      --text-muted: #97A69C;
      --border: #2A343B;
      --primary: #3EBE8E;
      --primary-dark: #2E9370;
      --accent: #FF9466;
      --accent-soft: #3A2A22;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #10151C;
    --bg-elevated: #1A2129;
    --text: #EAF1EC;
    --text-muted: #97A69C;
    --border: #2A343B;
    --primary: #3EBE8E;
    --primary-dark: #2E9370;
    --accent: #FF9466;
    --accent-soft: #3A2A22;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 48px;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 20px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .mark {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .mark svg { width: 18px; height: 18px; }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .tagline {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 1px 0 0;
  }

  /* Stats strip */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }

  .stat-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 12px;
    box-shadow: var(--shadow);
  }

  .stat-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.1;
  }

  .stat-value.accent { color: var(--accent); }
  .stat-value.primary { color: var(--primary); }

  .stat-label {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Card sections */
  .section {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    overflow: hidden;
  }

  .section-header {
    padding: 16px 18px 0;
  }

  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
  }

  .form-body {
    padding: 14px 18px 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }

  label {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-muted);
  }

  input, select {
    font-family: inherit;
    font-size: 14.5px;
    padding: 10px 11px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    outline: none;
    width: 100%;
  }

  input:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
  }

  .btn {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 9px;
    padding: 11px 16px;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }

  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
  .btn-danger-text { background: none; border: none; color: var(--danger); font-size: 13px; font-weight: 600; cursor: pointer; padding: 6px 8px; }

  .form-actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  /* Workout list */
  .list { padding: 6px 10px 12px; }

  .empty-state {
    padding: 30px 18px 34px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13.5px;
    line-height: 1.6;
  }

  .workout-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 8px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .workout-row:last-child { border-bottom: none; }

  .w-info { display: flex; align-items: center; gap: 12px; min-width: 0; }

  .w-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
  }

  .w-main { min-width: 0; }
  .w-name { font-size: 14.5px; font-weight: 600; }
  .w-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .w-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .w-cal { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14.5px; color: var(--accent); white-space: nowrap; }

  .icon-btn {
    background: none; border: none; cursor: pointer; padding: 5px;
    color: var(--text-muted); display: flex; border-radius: 7px;
  }
  .icon-btn:hover { background: var(--bg); color: var(--text); }
  .icon-btn svg { width: 16px; height: 16px; }

  .chart-wrap { padding: 6px 14px 18px; height: 200px; }

  footer {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 6.5l11 11M4 10l4-4M20 14l-4 4M2 12l3-3M22 12l-3 3M12 4l1.5 1.5M12 20l-1.5-1.5"/>
        </svg>
      </div>
      <div>
        <h1>FitTrack</h1>
        <p class="tagline">Your workout log, at a glance</p>
      </div>
    </div>
  </header>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value primary" id="statCount">0</div>
      <div class="stat-label">Workouts / 7d</div>
    </div>
    <div class="stat-card">
      <div class="stat-value primary" id="statMinutes">0</div>
      <div class="stat-label">Minutes / 7d</div>
    </div>
    <div class="stat-card">
      <div class="stat-value accent" id="statCalories">0</div>
      <div class="stat-label">Calories / 7d</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title" id="formTitle">Log a workout</div>
    </div>
    <form class="form-body" id="workoutForm">
      <div class="field full">
        <label for="exercise">Exercise type</label>
        <input id="exercise" placeholder="e.g. Running, Yoga, Cycling" required>
      </div>
      <div class="field">
        <label for="duration">Duration (min)</label>
        <input id="duration" type="number" min="1" placeholder="30" required>
      </div>
      <div class="field">
        <label for="calories">Calories burned</label>
        <input id="calories" type="number" min="1" placeholder="250" required>
      </div>
      <div class="field full">
        <label for="date">Date</label>
        <input id="date" type="date" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="submitBtn">Add workout</button>
        <button type="button" class="btn btn-ghost" id="cancelEditBtn" style="display:none;">Cancel</button>
      </div>
    </form>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">Workout history</div>
    </div>
    <div class="list" id="workoutList"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">Calories burned — last 7 days</div>
    </div>
    <div class="chart-wrap">
      <canvas id="calorieChart"></canvas>
    </div>
  </div>

  <footer>Data is stored only on this device, in this browser.</footer>
</div>

<script>
(function() {
  const STORAGE_KEY = 'fittrack_workouts';
  let workouts = [];
  let editingId = null;
  let chart = null;

  function loadWorkouts() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      workouts = raw ? JSON.parse(raw) : [];
    } catch (e) {
      workouts = [];
    }
  }

  function saveWorkouts() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(workouts));
    } catch (e) {
      console.error('Could not save workouts', e);
    }
  }

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function fmtDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function last7DaysWindow() {
    const end = new Date();
    end.setHours(0,0,0,0);
    const start = new Date(end);
    start.setDate(start.getDate() - 6);
    return { start, end };
  }

  function inLast7Days(dateStr) {
    const { start, end } = last7DaysWindow();
    const d = new Date(dateStr + 'T00:00:00');
    return d >= start && d <= end;
  }

  function renderStats() {
    const recent = workouts.filter(w => inLast7Days(w.date));
    const totalCal = recent.reduce((s, w) => s + w.calories, 0);
    const totalMin = recent.reduce((s, w) => s + w.duration, 0);
    document.getElementById('statCount').textContent = recent.length;
    document.getElementById('statMinutes').textContent = totalMin;
    document.getElementById('statCalories').textContent = totalCal;
  }

  function renderList() {
    const listEl = document.getElementById('workoutList');
    listEl.innerHTML = '';

    if (workouts.length === 0) {
      listEl.innerHTML = '<div class="empty-state">No workouts logged yet.<br>Add your first one above to start tracking.</div>';
      return;
    }

    const sorted = [...workouts].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

    sorted.forEach(w => {
      const row = document.createElement('div');
      row.className = 'workout-row';
      row.innerHTML = `
        <div class="w-info">
          <div class="w-dot"></div>
          <div class="w-main">
            <div class="w-name">${escapeHtml(w.exercise)}</div>
            <div class="w-meta">${fmtDate(w.date)} · ${w.duration} min</div>
          </div>
        </div>
        <div class="w-right">
          <div class="w-cal">${w.calories} cal</div>
          <button class="icon-btn" data-action="edit" data-id="${w.id}" aria-label="Edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
          </button>
          <button class="icon-btn" data-action="delete" data-id="${w.id}" aria-label="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg>
          </button>
        </div>
      `;
      listEl.appendChild(row);
    });

    listEl.querySelectorAll('[data-action="edit"]').forEach(btn => {
      btn.addEventListener('click', () => startEdit(parseInt(btn.dataset.id)));
    });
    listEl.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', () => deleteWorkout(parseInt(btn.dataset.id)));
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderChart() {
    const { start } = last7DaysWindow();
    const labels = [];
    const data = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(start);
      d.setDate(d.getDate() + i);
      const dStr = d.toISOString().slice(0, 10);
      labels.push(fmtDate(dStr));
      const dayTotal = workouts.filter(w => w.date === dStr).reduce((s, w) => s + w.calories, 0);
      data.push(dayTotal);
    }

    const styles = getComputedStyle(document.documentElement);
    const accent = styles.getPropertyValue('--accent').trim();
    const textMuted = styles.getPropertyValue('--text-muted').trim();
    const border = styles.getPropertyValue('--border').trim();

    if (chart) chart.destroy();
    const ctx = document.getElementById('calorieChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data,
          backgroundColor: accent,
          borderRadius: 6,
          maxBarThickness: 34
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: textMuted, font: { size: 11 } } },
          y: { beginAtZero: true, grid: { color: border }, ticks: { color: textMuted, font: { size: 11 } } }
        }
      }
    });
  }

  function renderAll() {
    renderStats();
    renderList();
    renderChart();
  }

  function startEdit(id) {
    const w = workouts.find(x => x.id === id);
    if (!w) return;
    editingId = id;
    document.getElementById('exercise').value = w.exercise;
    document.getElementById('duration').value = w.duration;
    document.getElementById('calories').value = w.calories;
    document.getElementById('date').value = w.date;
    document.getElementById('formTitle').textContent = 'Edit workout';
    document.getElementById('submitBtn').textContent = 'Save changes';
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    document.getElementById('workoutForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function cancelEdit() {
    editingId = null;
    document.getElementById('workoutForm').reset();
    document.getElementById('date').value = todayStr();
    document.getElementById('formTitle').textContent = 'Log a workout';
    document.getElementById('submitBtn').textContent = 'Add workout';
    document.getElementById('cancelEditBtn').style.display = 'none';
  }

  function deleteWorkout(id) {
    workouts = workouts.filter(w => w.id !== id);
    saveWorkouts();
    renderAll();
    if (editingId === id) cancelEdit();
  }

  document.getElementById('workoutForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const exercise = document.getElementById('exercise').value.trim();
    const duration = parseInt(document.getElementById('duration').value, 10);
    const calories = parseInt(document.getElementById('calories').value, 10);
    const date = document.getElementById('date').value;

    if (!exercise || !duration || !calories || !date) return;

    if (editingId !== null) {
      const w = workouts.find(x => x.id === editingId);
      if (w) { w.exercise = exercise; w.duration = duration; w.calories = calories; w.date = date; }
    } else {
      workouts.push({ id: Date.now(), exercise, duration, calories, date });
    }

    saveWorkouts();
    renderAll();
    cancelEdit();
  });

  document.getElementById('cancelEditBtn').addEventListener('click', cancelEdit);

  // Init
  loadWorkouts();
  document.getElementById('date').value = todayStr();
  renderAll();
})();
</script>
</body>
</html>
